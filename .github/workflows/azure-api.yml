# Despliega la carpeta backend/ a Azure App Service (PHP).
# Secretos requeridos en GitHub: AZURE_WEBAPP_PUBLISH_PROFILE
# (App Service → Get publish profile → pegar el XML completo)

name: Deploy API to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'sigemad-api' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend
