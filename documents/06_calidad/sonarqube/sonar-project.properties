# Canónico: documents/06_calidad/sonarqube/sonar-project.properties
# SonarQube local. El token no va en este archivo (variable SONAR_TOKEN).
# Desde la raíz del repo, con el scanner en Docker (host.docker.internal llega al puerto 9000 del host):
#   docker run --rm -e SONAR_TOKEN -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli `
#     "-Dproject.settings=documents/06_calidad/sonarqube/sonar-project.properties" `
#     "-Dsonar.projectBaseDir=/usr/src" `
#     "-Dsonar.host.url=http://host.docker.internal:9000"

sonar.host.url=http://localhost:9000

sonar.projectKey=sigemad
sonar.projectName=sigemad
sonar.projectVersion=0.10.7

# Código fuente propio (3 lenguajes)
sonar.sources=src,backend/api/v2,ml/app,ml/scripts
sonar.sourceEncoding=UTF-8

# Excluir dependencias, builds, datos, binarios y esta documentación
sonar.exclusions=**/node_modules/**,**/dist/**,**/vendor/**,**/__pycache__/**,**/*.pyc,**/ml/models/**,**/ml/data/**,**/ml/notebooks/**,**/documents/**,**/backend/tools/**,**/*.csv,**/*.joblib,**/*.sql,**/*.test.js,**/*Test.php

